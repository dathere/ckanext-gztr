scheming_version: 2
dataset_type: application
about_url: https://dathere.com/applications-schema


dataset_fields:

- field_name: title
  label: Title
  preset: title
  form_placeholder: eg. A Descriptive Title

- field_name: name
  label: URL
  preset: dataset_slug
  form_placeholder: eg. a-descriptive-title

- field_name: owner_org
  label: Organization
  required: True
  preset: dataset_organization

- field_name: notes
  label: Description
  required: True
  form_snippet: markdown.html
  form_placeholder: eg. Some useful notes about the data

- field_name: group
  label: Categories
  preset: multiple_checkbox
  choices_helper: gztr_groups_choices
  required: False
  help_text: Broad categories these data fall within. For data curation purposes, users should be a member of the category to add a dataset to the category.

#- field_name: primary_tags
#  label: Tags
#  preset: multiple_select
#  choices_helper: scheming_datastore_choices
