scheming_version: 2
dataset_type: dataset
about: An example schema for using the dataset publisher gazetteer from ckanext-gztr.
about_url: http://github.com/dathere/ckanext-gztr

dataset_fields:
  - field_name: title
    label: Title
    preset: title
    required: True
    form_placeholder: eg. A descriptive title

  - field_name: name
    label: URL
    preset: dataset_slug
    form_placeholder: eg. my-dataset

  - field_name: owner_org
    label: Organization
    required: True
    preset: dataset_organization

  - field_name: description
    label: Description
    form_snippet: markdown.html
    # Rendered as markdown on the dataset page above "Data and Resources"
    # (see templates/package/read.html), not in the additional info table.
    display_snippet: null
    form_placeholder: Some useful notes about the data
    suggestion_formula: 'Dataset contains {{ dpp.dataset_stats.RECORD_COUNT }} records with the following columns: {{ dpps.keys() | join(", ") }}.'
    ai_suggestion: true

  - field_name: tag_string
    label: Tags
    preset: tag_string_autocomplete
    form_placeholder: eg. economy, mental health, government
    ai_suggestion: true
    ai_suggestion_key: tags

  - field_name: author
    label: Author
    form_placeholder: Joe Bloggs
    required: false

  - field_name: author_email
    label: Author Email
    form_placeholder: joe@example.com
    required: false

  - field_name: gazetteer
    label: Indicate Spatial Coverage
    form_snippet: gazetteer_widget.html
    display_snippet: null
    validators: ignore_missing gazetteer_validator
    output_validators: scheming_load_json
  - field_name: spatial_full
    label: Geospatial metadata
    display_snippet: gazetteer_preview.html
    # display_snippet: null
    # TODO: Custom form snippet that has a useful expandable JSON viewer?
    form_snippet: text.html
    form_placeholder: Filled in automatically as you select areas above.
  # - field_name: spatial
  #   label: Geospatial region (simplified)
  #   display_snippet: gazetteer_preview.html
  #   # display_snippet: null
  #   form_snippet: text.html
  #   form_placeholder: Filled in automatically as you select areas above.
  # - field_name: place_keywords
  #   label: Place Keywords
  #   display_snippet: text.html
  #   form_attrs:
  #     data-module: place_keywords
  #   form_placeholder: Filled in automatically as you select areas above.

  - field_name: spatial_description
    label: Spatial Description
    form_snippet: markdown.html
    form_placeholder: eg. Select common placenames and/or describe the general location where data from this resource are located.
    suggestion_formula: "{% if not dpp.NO_LAT_LON_FIELDS %}Dataset contains geographic point data. Latitude column: \"{{ dpp.LAT_FIELD }}\", Longitude column: \"{{ dpp.LON_FIELD }}\".{% endif %}"

  - field_name: coordinate_system
    label: Coordinate System
    help_text: Select Coordinate Reference Systems
    help_inline: true
    preset: select
    form_include_blank_choice: true
    suggestion_formula: "{% if not dpp.NO_LAT_LON_FIELDS %}WGS84{% endif %}"
    choices:
    - label: WGS84
      value: WGS84
    - label: NAD27
      value: NAD27
    - label: NAD83
      value: NAD83
    - label: other
      value: other

  - field_name: update_frequency
    label: Update Frequency
    form_include_blank_choice: true
    preset: select
    suggestion_formula: |
      {%- if not dpp.NO_DATE_FIELDS -%}
      {%- set freq = guess_accrual_periodicity() -%}
      {%- if freq == 'R/P1D' -%}daily
      {%- elif freq == 'R/P7D' -%}weekly
      {%- elif freq in ['R/P1M', 'R/P30D'] -%}monthly
      {%- elif freq == 'R/P3M' -%}quarterly
      {%- elif freq == 'R/P6M' -%}every 6 months
      {%- elif freq in ['R/P12M', 'R/P1Y'] -%}annually
      {%- else -%}other
      {%- endif -%}
      {%- endif -%}
    choices:
    - label: Real-time
      value: real-time
    - label: 15 minutes or less
      value: 15 minutes or less
    - label: Hourly
      value: hourly
    - label: Daily
      value: daily
    - label: Weekly
      value: weekly
    - label: Monthly
      value: monthly
    - label: Quarterly
      value: quarterly
    - label: Every 6 months
      value: every 6 months
    - label: Annually
      value: annually
    - label: As needed
      value: as needed
    - label: Never
      value: never
    - label: Other
      value: other

  - field_name: primary_key_field
    label: Primary Key Field
    form_placeholder: Select primary key field with unique record identifier
    suggestion_formula: "{% for field in dpps if dpps[field].stats.uniqueness_ratio | float == 1.0 and field != '_id' %}{% if loop.first %}{{ field }}{% endif %}{% endfor %}"

  # Storage slot DP+ writes formula results (dpp_suggestions.package) and
  # describegpt output (dpp_suggestions.ai_suggestions) into. Hidden from the
  # form and the dataset page — the suggestion buttons read it directly.
  - field_name: dpp_suggestions
    label: DPP Suggestions
    preset: json_object
    form_snippet: null
    display_snippet: null

resource_fields:
  - field_name: url
    label: URL
    preset: resource_url_upload

  - field_name: name
    label: Name
    form_placeholder: eg. January 2011

  - field_name: description
    label: Description
    form_snippet: markdown.html
    form_placeholder: Some useful notes about the data

  - field_name: format
    label: Format
    preset: resource_format_autocomplete
