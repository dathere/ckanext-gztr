scheming_version: 2
dataset_type: dataset
about: An example schema for using the dataset publisher gazetteer from ckanext-gztr.
about_url: http://github.com/dathere/ckanext-gztr

dataset_fields:
  - field_name: title
    label: Title
    preset: title
    required: True
    form_placeholder: eg. A descriptive title

  - field_name: name
    label: URL
    preset: dataset_slug
    form_placeholder: eg. my-dataset

  - field_name: owner_org
    label: Organization
    required: True
    preset: dataset_organization

  - field_name: description
    label: Description
    form_snippet: markdown.html
    form_placeholder: Some useful notes about the data

  - field_name: tag_string
    label: Tags
    preset: tag_string_autocomplete
    form_placeholder: eg. economy, mental health, government

  - field_name: author
    label: Author
    form_placeholder: Joe Bloggs
    required: false

  - field_name: author_email
    label: Author Email
    form_placeholder: joe@example.com
    required: false

  - field_name: gazetteer
    label: Indicate Spatial Coverage
    form_snippet: gazetteer_widget.html
    display_snippet: null
    validators: ignore_missing gazetteer_validator
    output_validators: scheming_load_json
  - field_name: spatial_full
    label: Spatial Full
    display_snippet: gazetteer_preview.html
    form_snippet: text.html
    form_placeholder: Filled in automatically as you select areas above.
  - field_name: spatial
    label: Spatial
    display_snippet: null
    form_snippet: text.html
    form_placeholder: Filled in automatically as you select areas above.
  - field_name: place_keywords
    label: Place Keywords
    display_snippet: text.html
    form_attrs:
      data-module: place_keywords

resource_fields:
  - field_name: url
    label: URL
    preset: resource_url_upload

  - field_name: name
    label: Name
    form_placeholder: eg. January 2011

  - field_name: description
    label: Description
    form_snippet: markdown.html
    form_placeholder: Some useful notes about the data

  - field_name: format
    label: Format
    preset: resource_format_autocomplete
