scheming_version: 2
organization_type: organization
about: A re-implementation of the default CKAN organization schema
about_url: http://github.com/ckan/ckanext-scheming

fields:

- field_name: title
  label: Name
  validators: ignore_missing unicode
  form_snippet: large_text.html
  form_attrs:
    data-module: slug-preview-target
  form_placeholder: My Organization

- field_name: name
  label: URL
  validators: not_empty unicode name_validator group_name_validator
  form_snippet: slug.html
  form_placeholder: my-organization

- field_name: acronym
  label: Acronym
  form_placeholder: eg. CKAN
  help_text: Abbreviation formed from the initial letters of other words and pronounced as a word.

- field_name: alternate_names
  label: Alternate Names
  form_placeholder: eg. CKAN
  help_text: Any common alternate names that the organization may be called. Will be used for search functionality..

- field_name: description
  label: Description
  form_snippet: markdown.html
  form_placeholder: Brief description of who the organization is and what it does.

- field_name: image_url
  label: Image URL
  form_snippet: organization_upload.html
  form_placeholder: https://example.com/my-image.jpg
  help_text: A logo or general picture to help visually identify the organization.

- field_name: pid
  label: Persistent Identifier
  form_placeholder: eg. 1043
  help_text: Persistent identifier for organization.

- field_name: website_link
  label: Website Link
  form_placeholder: https://dathere.com/
  help_text: Url for organization website.
