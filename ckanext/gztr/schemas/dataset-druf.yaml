scheming_version: 2
dataset_type: dataset
about: A re-implementation of the default CKAN dataset schema
about_url: http://github.com/ckan/ckanext-scheming

draft_fields_required: false

display_group_order:
  [
    "Primary Information",
    "Quality-Update",
    "Description",
    "Spatial",
    "Additional",
    "Data-Dictionary",
  ]

dataset_fields:
  - start_form_page:
      title: Primary Information
      description: Page 1

    field_name: title
    label: Title
    preset: title
    required: True
    form_placeholder: eg. A descriptive title

  - field_name: name
    label: URL
    preset: dataset_slug
    form_placeholder: eg. my-dataset

  - field_name: notes
    label: Abstract
    required: True
    form_snippet: markdown.html
    form_placeholder: eg. Some useful notes about the data

  - field_name: owner_org
    label: Organization
    required: True
    preset: dataset_organization

  - field_name: data_admin_approved
    label: Data Admin Approved
    preset: select_if_sysadmin_else_false
    required: True
    form_include_blank_choice: False
    choices:
      - label: Not Yet Approved
        value: false
      - label: Approved
        value: true
    validators: ignore_missing
    help_text_sysadmin: Help text sysadmin
    help_text_not_sysadmin: Help text not sysadmin
    help_text: Default help text

  - field_name: program_area
    label: Program Area
    form_placeholder: Responsible or associated program area or team

  - field_name: data_contact_email
    label: Data Contact Email
    validators: email_validator
    form_placeholder: gztrfriend@example.com
    required: True
    display_snippet: email-via-contact-form.html
    form_placeholder: Professional email for data questions or concerns.

  - start_form_page:
      title: Update + Quality Information
      description: Page 3

    field_name: collection_method
    label: Collection Method
    required: True
    help_text: The procedure, technique, or mode of inquiry used to attain data. Also referred to as "Data Capture Method".
    help_allow_html: true
    form_include_blank_choice: true
    preset: select
    choices:
      - label: Administrative Record
        value: administrative record
      - label: Physical Measurement
        value: physical measurement
      - label: Imagery
        value: imagery
      - label: Observation
        value: observation
      - label: Experiment
        value: experiment
      - label: Survey
        value: survey
      - label: Model output
        value: model output
      - label: Geocoding
        value: geocoding
      - label: Digitization
        value: digitization
      - label: Ground Survey
        value: ground survey
      - label: GPS Measurement
        value: gps measurement
      - label: Unknown
        value: unknown
      - label: Other
        value: other

  - field_name: collection_method_description
    label: Collection Method Description
    form_snippet: markdown.html
    help_text: Method by which items are added to a collection (i.e. sensor data, field collection, etc.).
    help_allow_html: true

  - field_name: quality_control_level
    label: Quality Control Level
    #required: True
    help_text: A controlled list of options to describe the level of review and correction that has been applied to the data resource.
    form_include_blank_choice: true
    preset: select
    choices:
      - label: Raw/Provisional/Unreviewed
        value: Raw/Provisional/Unreviewed
      - label: Automatic Rules
        value: Automatic Rules
      - label: Manual Spot Check
        value: Manual Spot Check
      - label: Review (one person)
        value: Review (one person)
      - label: Comprehensive Review (multiple people)
        value: Comprehensive Review (multiple people)
      - label: Draft
        value: Draft
      - label: Under Review
        value: Under Review

  - field_name: quality_assurance_description
    label: Quality Assurance Description
    form_snippet: markdown.html
    help_text: Description of the QA/QC steps or analysis methods applied to the data resource.

  - field_name: update_type
    label: Update Type
    help_text: Select Update Type
    help_inline: true
    form_include_blank_choice: true
    preset: select
    choices:
      - label: Automatic
        value: automatic
      - label: Manual
        value: manual
      - label: None
        value: none

  - field_name: end_date
    label: Automatic Update End Date
    form_snippet: date.html
    validators: ignore_missing check_end_date
    help_text: If this dataset has an Update Type of Automatic and Automatic Updates should stop at some point, please indicate the end date at which Automatic Updates should stop. If not, leave this field blank.
    help_inline: true

  - field_name: update_frequency
    label: Update Frequency
    #required: True
    form_include_blank_choice: true
    preset: select
    choices:
      - label: Real-time
        value: real-time
      - label: 15 minutes or less
        value: 15 minutes or less
      - label: Hourly
        value: hourly
      - label: Daily
        value: daily
      - label: Weekly
        value: weekly
      - label: Monthly
        value: monthly
      - label: Quarterly
        value: quarterly
      - label: Every 6 months
        value: every 6 months
      - label: Annually
        value: annually
      - label: As needed
        value: as needed
      - label: Never
        value: never
      - label: Other
        value: other

  - field_name: next_update
    label: Next Update
    form_snippet: date.html

  - start_form_page:
      title: Description Information
      description: Page 4

    field_name: caveats_usage
    label: Caveats and Usage
    form_snippet: markdown.html
    help_text: this help is going to be displayed inline.
    help_inline: true

  - field_name: group
    label: Categories
    preset: multiple_checkbox
    choices_helper: gztr_scheming_groups_choices
    required: False
    help_text: Broad categories these data fall within. For data curation purposes, users should be a member of the category to add a dataset to the category.

  - field_name: primary_tags
    label: Primary Tags
    preset: multiple_select
    choices_helper: scheming_datastore_choices
    datastore_choices_resource: Tags-tags-gztr
    datastore_choices_columns:
      value: Label
      label: Term
    form_placeholder: eg. water, health, government
    required: False
    help_text: Other associated keywords used for filter, search, and description of resource.
    form_snippet: multiple_select_short.html

  - field_name: secondary_tags
    label: Secondary Tags
    preset: multiple_select
    choices_helper: scheming_datastore_choices
    datastore_choices_resource: Tags-tags-gztr
    datastore_choices_columns:
      value: Label
      label: Term
    form_placeholder: eg. water, health, government
    help_text: Other associated keywords used for filter, search, and description of resource.
    form_snippet: multiple_select_short.html

  - field_name: tag_string
    label: Tags
    preset: tag_string_autocomplete
    form_placeholder: eg. economy, mental health, government
    ai_suggestion: true
    ai_suggestion_key: tags

  - start_form_page:
      title: Spatial Information
      description: Page 5

    ## Enabling these for development of the Gazetteer Widget display, for when it is brought into the website
    ## "gazetteer_widget"
    field_name: gazetteer_widget
    label: Indicate Spatial Coverage
    form_snippet: gazetteer_widget.html
    display_snippet: null # for read-only mode, see "spatial_details" field which is the generated GeoJSON
    #
    # config options joining the Gazetteer Widget to other fields
    # load_geojson_field -- A field to check for GeoJSON content, and load as at startup.
    #                       Great when set to the same as geojson_field, to load its own saved data.
    # geojson_field -- A field to be updated when areas are changed.
    #                  Content will be a GeoJSON document of the saved places.
    #                  Great when set to the same as load_geojson_field, so saved data will be loaded at next startup.
    #                  The specified field should be configured with JSON validation.
    # extent_field -- A field to be updated when areas are changed.
    #                 Content will be a single GeoJSON feature, its geometry being the polygonal bounding box of all selected areas.
    #                 The specified field should be configured with JSON validation.
    # load_bbox_composite_field -- A composite field to be examined, in order to provide the 4 sides of a bounding box.
    #                              This will be a composite field with 4 sub-fields supplying the west, east, south, and north coordinates.
    #                              You must also specify the sub-fields:
    #                              load_bbox_composite_south, load_bbox_composite_north, load_bbox_composite_east, and load_bbox_composite_west.
    #                              Sub-fields should be numeric fields. Any non-numeric data (empty fields, etc.) will cause the field to be ignored.
    # save_bbox_composite -- Set this to "true" in order to have the widget automatically update the composite field with the new bounding box, whenever the extent changes.
    # geojson_field_custom -- Same as geojson_field,
    #                         but instead of a proper field, it's the name of a Custom Field to be found or created.
    # extent_field_custom -- Same as extent_field,
    #                        but instead of a proper field, it's the name of a Custom Field to be found or created.
    # spatial_coverage_textbox -- A markdown/text field to populate with the names of list of selected places.
    #                             A button will be created, and clicking this will replace the text field content with a list of selected areas.
    #                             The spatial_coverage_tagfield_buttontext option specifies the text of the button.
    # spatial_coverage_tagfield -- A autocomplete/Select2 field to populate with tags listing the selected places.
    #                              This is similar in ida to the spatial_coverage_textbox, but instead of a text box a tag entry UI is expected.
    #                              The spatial_coverage_textbox_buttontext option specifies the text of the button.
    #
    # As described above, the spatial data may be loaded from several potential fields.
    # In manage mode this widget will check for some data to pre-populate itself. These fields will be checked, in this order of preference:
    # - the field specified by "load_geojson_field"
    # - the four sub-fields of the composite field specified by "load_bbox_composite_field"
    # - the field specified by "extent_field"
    # - the field specified by" extent_field_custom"
    #
    load_geojson_field: spatial_details
    geojson_field: spatial_details
    #extent_field: bboxgeometry
    #geojson_field_custom: customjson
    extent_field_custom: spatial
    #spatial_coverage_textbox: spatial_coverage
    #spatial_coverage_textbox_buttontext: Copy to Spatial Coverage field
    spatial_coverage_tagfield: placeKeywords
    spatial_coverage_tagfield_buttontext: Copy to Place Keywords
    load_bbox_composite_field: boundingCoordinate
    load_bbox_composite_south: southBoundingCoordinate
    load_bbox_composite_north: northBoundingCoordinate
    load_bbox_composite_east: eastBoundingCoordinate
    load_bbox_composite_west: westBoundingCoordinate
    save_bbox_composite: true

  ## This is the view mode for displaying a simplified, read-only widget showing the location.
  ## "spatial_details"
  - field_name: spatial_details
    label: Spatial Coverage
    form_snippet: text.html
    form_placeholder: Filled in automatically as you select areas above.
    # The spatial_details.html checks several fields, trying to find spatial information to display on a map.
    # It checks the following fields, in this order of preference:
    # - the "spatial_details" record field, which would contain a GeoJSON document createrd by the gazetteer_widget
    # - the "boundingCoordinate" composite field, but only if all 4 fields contain numbers
    # - the "spatial" custom fields, which would contain a bounding box polygon in GeoJSON format
    display_snippet: spatial_details.html
    validators: scheming_required scheming_valid_json_object

  # - field_name: placeKeywords
  #   label: Place Keywords
  #   # This is turned off because we are not creating tags from placeKeywords ... yet
  #   # preset: tag_string_autocomplete
  #   display_snippet: place_keywords.html

  ## "bounding_coordinate"
  # - field_name: boundingCoordinate
  #   label: Bounding Coordinates
  #   display_group: Spatial
  #   subfields:
  #     - field_name: northBoundingCoordinate
  #       label: North
  #     - field_name: eastBoundingCoordinate
  #       label: East
  #     - field_name: southBoundingCoordinate
  #       label: South
  #     - field_name: westBoundingCoordinate
  #       label: West

  - field_name: spatial_description
    label: Spatial Description
    form_snippet: markdown.html
    form_placeholder: eg. Select common placenames and/or describe the general location where data from this resource are located.

  - field_name: coordinate_system
    label: Coordinate System
    help_text: Select Coordinate Reference Systems
    help_inline: true
    form_include_blank_choice: true
    preset: select
    choices:
      - label: WGS84
        value: WGS84
      - label: NAD27
        value: NAD27
      - label: NAD83
        value: NAD83
      - label: other
        value: other

  - field_name: coordinate_field_format
    label: Coordinate Field Format
    help_text: Select Coordinate Field Format
    help_inline: true
    form_include_blank_choice: true
    preset: select
    choices:
      - label: Longitude/Latitude
        value: longitude/latitude
      - label: Latitude/Longitude
        value: latitude/longitude
      - label: other
        value: other

  - start_form_page:
      title: Data Dictionary
      description: Page 6

    field_name: data_dictionary
    label: Data Dictionary
    form_snippet: data_dictionary.html

  - field_name: date_range
    label: Date Range
    required: False
    form_snippet: date_range_optional.html
    validators: ignore_missing parse_date_range_optional
    help_text: The Date Range field represents the current date range the dataset covers. If this dataset has an Update Type of Automatic, the end date on this date range will be automatically incremented with the passage of time.
    help_inline: true

  - field_name: from_date
    label: From Date
    form_snippet: null

  - field_name: to_date
    label: To Date
    form_snippet: null

  - field_name: primary_key_field
    label: Primary Key Field
    form_placeholder: Select primary key field with unique record identifier

  - start_form_page:
      title: Additional Information
      description: Page 7

    field_name: disclaimer
    label: Disclaimer
    form_snippet: markdown.html

  - field_name: additional_information
    display_group: Additional
    label: Additional Information
    form_snippet: markdown.html
    help_text: Any additional information that is important for users to know about the data resource

  - field_name: related_resources
    label: Related Resources
    validators: ignore_missing
    preset: multiple_text

  - field_name: linked_datasets
    label: Linked Datasets
    validators: ignore_missing
    preset: multiple_text

  - field_name: supporting_url
    label: Supporting URLs
    plural_label: Supporting URLs
    validators: ignore_missing
    preset: multiple_url

resource_fields:
  - field_name: url
    label: URL
    preset: resource_url_upload

  - field_name: name
    label: Name
    form_placeholder: eg. January 2011

  - field_name: description
    label: Description
    form_snippet: markdown.html
    form_placeholder: Some useful notes about the data

  - field_name: format
    label: Format
    preset: resource_format_autocomplete
