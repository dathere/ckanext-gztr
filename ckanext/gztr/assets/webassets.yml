quick_extent_switch-js:
  filter: rjsmin
  output: ckanext-gztr/%(version)s-quick_extent_switch.js
  contents:
    - quick-extent-switch.js
  extra:
    preload:
      - base/main

gztr_theme-css:
  filter: cssrewrite
  output: ckanext-gztr_theme/%(version)s-gztr_theme.css
  contents:
    - ckanext_gztr.css

gazetteer_dataset_publisher-react-js:
  filter: rjsmin
  output: ckanext-gztr/%(version)s-gazetteer_widget.js
  contents:
    - gztr-dataset-publisher/assets/index.js

gztr_public_search-react-js:
  filter: rjsmin
  output: ckanext-gztr/%(version)s-gztr_search_widget.js
  contents:
    - gztr-public-search/assets/index.js

place_keywords-js:
  filter: rjsmin
  output: ckanext-gztr/%(version)s-place_keywords.js
  contents:
    - gazetteer/js/place_keywords.js
