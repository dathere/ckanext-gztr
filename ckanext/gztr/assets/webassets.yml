gztr_theme-js:
    #filter: rjsmin
  output: ckanext-gztr_theme/%(version)s-gztr_theme.js
  contents:
    - leaflet.js
    - gztr_theme.js
  extra:
    preload:
      - base/main

gztr_theme-css:
  filter: cssrewrite
  output: ckanext-gztr_theme/%(version)s-gztr_theme.css
  contents:
    - leaflet.css
    - ckanext_gztr.css
    
