gztr_theme-js:
    #filter: rjsmin
  output: ckanext-gztr_theme/%(version)s-gztr_theme.js
  contents:
    - leaflet.js
    - gztr_theme.js
    - statewide-search.js
  extra:
    preload:
      - base/main

gztr_theme-css:
  filter: cssrewrite
  output: ckanext-gztr_theme/%(version)s-gztr_theme.css
  contents:
    - leaflet.css

gazetteer_widget-react-js:
  filter: rjsmin
  output: ckanext-gztr/%(version)s-gazetteer_widget.js
  contents:
    - gztr-react/assets/index.js

gztr_search_widget-react-js:
  filter: rjsmin
  output: ckanext-gztr/%(version)s-gztr_search_widget.js
  contents:
    - gztr-search/assets/index.js

place_keywords-js:
  filter: rjsmin
  output: ckanext-gztr/%(version)s-place_keywords.js
  contents:
    - gazetteer/js/place_keywords.js
