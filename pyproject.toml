[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ckanext-gztr"
version = "0.1.0"
description = "CKAN extension that adds general-purpose geospatial capabilities."
readme = "README.md"
authors = [
    { name = "datHere", email = "support@dathere.com" }
]
license = "AGPL-3.0-or-later"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]
keywords = [ "CKAN", "extension"]
dependencies = [
    "shapely",
]
requires-python = ">=3.10"

[project.optional-dependencies]
# Backs the `gztr` file storage with S3 instead of the local filesystem,
# for deployments where the filesystem is not durable. See the `gztr:s3`
# storage in ckanext/gztr/storage.py.
s3 = ["ckanext-file-keeper-cloud[s3]"]

[project.urls]
Homepage = "https://gztr.dathere.com"
Repository = "https://github.com/dathere/ckanext-gztr"
Issues = "https://github.com/dathere/ckanext-gztr/issues"

[project.entry-points."ckan.plugins"]
gztr = "ckanext.gztr.plugin:GZTRPlugin"

[project.entry-points."babel.extractors"]
ckan = "ckan.lib.extract:extract_ckan"

[tool.setuptools.packages]
find = {}
